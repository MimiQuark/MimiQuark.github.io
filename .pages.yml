media:
  input: public/uploads
  output: /public/uploads
  categories: [image]
  rename: true

content:
  - name: site
    label: 页面与个人资料
    type: file
    path: _data/site.json
    fields:
      - name: page
        label: 页面设置
        type: object
        fields:
          - { name: blogName, label: 博客名称, type: string }
          - { name: metaTitle, label: 浏览器标题, type: string }
          - { name: metaDescription, label: 搜索摘要, type: text }
          - { name: adminUrl, label: 后台管理地址, type: string }
          - { name: heroSummary, label: 博客说明, type: text }
          - name: cover
            label: 顶部背景文字
            type: object
            fields:
              - { name: eyebrow, label: 英文标签, type: string }
              - { name: title, label: 背景主标题, type: string }
              - { name: subtitle, label: 背景副标题, type: string }
          - name: labels
            label: 页面按钮文字
            type: object
            fields:
              - { name: githubButton, label: GitHub 按钮, type: string }
              - { name: adminButton, label: 后台按钮, type: string }
              - { name: columnsTitle, label: 专栏标题, type: string }
              - { name: interestsTitle, label: 写作方向标题, type: string }
              - { name: allArticles, label: 全部文章按钮, type: string }
          - name: feed
            label: 文章流文案
            type: object
            fields:
              - { name: searchPlaceholder, label: 搜索框提示, type: string }
              - { name: notesTabLabel, label: 文章标签名称, type: string }
              - { name: projectsTabLabel, label: 项目标签名称, type: string }
              - { name: emptyText, label: 空结果提示, type: string }
          - name: profile
            label: 博客资料
            type: object
            fields:
              - { name: displayName, label: 公开昵称, type: string }
              - { name: avatarImage, label: 头像图片, type: image }
              - { name: avatarText, label: 无头像时文字, type: string }
              - { name: coverImage, label: 顶部背景图, type: image }
              - name: visitCounter
                label: 网站访问计数
                type: object
                fields:
                  - { name: namespace, label: 服务命名空间, type: string }
                  - { name: key, label: 计数键, type: string }
                  - { name: endpoint, label: 计数接口模板, type: string }
                  - { name: fallback, label: 接口失败时显示值, type: number }
              - { name: headline, label: 一句话标题, type: string }
              - { name: bio, label: 个人简介, type: text }
              - { name: status, label: 博客状态, type: string }
              - { name: badges, label: 身份标签, type: string, list: true }
              - name: stats
                label: 顶部统计
                type: object
                list: true
                fields:
                  - { name: label, label: 指标名称, type: string }
                  - { name: value, label: 指标数值, type: string }
              - name: columns
                label: 我的专栏
                type: object
                list: true
                collapsible:
                  collapsed: false
                  summary: "{title}"
                fields:
                  - { name: title, label: 专栏名称, type: string }
                  - { name: count, label: 文章数量, type: number }
                  - { name: icon, label: 图标类型, type: string }
              - name: interests
                label: 写作方向
                type: object
                list: true
                collapsible:
                  collapsed: false
                  summary: "{title}"
                fields:
                  - { name: title, label: 领域名称, type: string }
                  - { name: tags, label: 方向标签, type: string, list: true }
          - name: author
            label: 兼容旧字段
            type: object
            fields:
              - { name: displayName, label: 公开昵称, type: string }
              - { name: avatarText, label: 头像文字, type: string }
              - { name: headline, label: 一句话标题, type: string }
              - { name: bio, label: 博客简介, type: text }
              - { name: topics, label: 关注方向, type: string, list: true }
          - { name: heroTags, label: 首页关键词, type: string, list: true }

  - name: projects
    label: 项目记录
    type: file
    path: _data/projects.json
    fields:
      - name: items
        label: 项目列表
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{title}"
        fields:
          - { name: id, label: 唯一标识, type: string }
          - { name: number, label: 编号, type: string }
          - { name: title, label: 项目名称, type: string }
          - { name: type, label: 项目类型, type: string }
          - { name: role, label: 参与角色, type: string }
          - { name: period, label: 项目时间, type: string }
          - { name: stack, label: 技术栈, type: string, list: true }
          - { name: summary, label: 项目介绍, type: text }
          - { name: challenge, label: 遇到的问题, type: string, list: true }
          - { name: solution, label: 解决方法, type: string, list: true }
          - { name: impact, label: 结果与复盘, type: string, list: true }
          - { name: highlight, label: 核心亮点, type: string }
          - { name: detailMarkdown, label: 详细 Markdown 路径, type: string }

  - name: notes
    label: 文章管理
    type: file
    path: _data/notes.json
    fields:
      - name: items
        label: 文章列表
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{title}"
        fields:
          - { name: id, label: 唯一标识, type: string }
          - { name: number, label: 编号, type: string }
          - { name: category, label: 分类（可自定义）, type: string }
          - { name: title, label: 标题, type: string }
          - { name: excerpt, label: 摘要, type: text }
          - { name: date, label: 日期, type: string }
          - { name: readTime, label: 阅读时间, type: string }
          - { name: views, label: 阅读量, type: number }
          - { name: likes, label: 点赞数, type: number }
          - { name: comments, label: 评论数, type: number }
          - { name: bookmarks, label: 收藏数, type: number }
          - name: coverImage
            label: 封面图片
            type: image
          - { name: lead, label: 导语, type: text }
          - name: sections
            label: 正文
            type: object
            list: true
            fields:
              - { name: heading, label: 小标题, type: string }
              - name: content
                label: 内容
                type: rich-text
