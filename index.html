<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#f3f5f7">
  <meta property="og:title" content="MimiQuark 技术博客">

  <meta property="og:type" content="website">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="profile.css?v=20261006-profile-layout">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "MimiQuark 技术博客",
      "description": "项目过程、问题排查与工程复盘。"
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#articles">跳到主要内容</a>
  <div class="page-noise" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <div class="nav-shell">
      <a class="brand" href="#home" aria-label="返回主页">
        <span class="brand-mark">MQ</span>
        <span class="brand-copy"><strong id="brandName">MimiQuark 技术博客</strong><small>ENGINEERING NOTES</small></span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a class="nav-link active" href="#home">主页</a>
        <a class="nav-link" href="#articles" data-nav-tab="notes">文章</a>
        <a class="nav-link" href="#articles" data-nav-tab="projects">项目</a>
        <a class="nav-link" href="#about">关于</a>
      </nav>
      <div class="nav-actions">
        <label class="header-search" for="siteSearch">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="siteSearch" type="search" placeholder="搜索文章、项目或技术关键词…" autocomplete="off">
        </label>
        <a class="admin-link" id="adminLink" href="#" target="_blank" rel="noreferrer">后台管理</a>
        <button class="theme-toggle" type="button" aria-label="切换主题" title="切换主题">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path></svg>
        </button>
        <button class="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false"><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main id="main" class="profile-page">
    <section class="profile-shell section-shell" id="home">
      <div class="profile-cover" id="profileCover">
        <div class="cover-sketch" aria-hidden="true"><span class="sketch-plane">✈</span><strong>Hello world / no bug!</strong></div>
      </div>
      <div class="profile-card reveal">
        <div class="profile-avatar" id="profileAvatar"><img id="profileAvatarImage" alt="" hidden><span id="profileAvatarText">MQ</span></div>
        <div class="profile-main">
          <div class="profile-title-row">
            <div>
              <h1 id="profileName">MimiQuark</h1>
              <div class="profile-badges" id="profileBadges"></div>
            </div>
            <div class="profile-actions">
              <a class="pill-button" href="https://github.com/MimiQuark" target="_blank" rel="noreferrer">访问 GitHub</a>
              <a class="pill-button primary" id="profileAdminButton" href="#" target="_blank" rel="noreferrer">维护内容</a>
            </div>
          </div>
          <p class="profile-headline" id="profileHeadline"></p>
          <div class="profile-stats" id="profileStats"></div>
          <div class="profile-meta" id="profileMeta"></div>
          <p class="profile-bio" id="profileBio"></p>
        </div>
      </div>
    </section>

    <div class="content-layout section-shell">
      <aside class="sidebar" id="about" aria-label="个人数据与分类">
        <section class="sidebar-card reveal">
          <div class="sidebar-heading"><h2>个人成就</h2></div>
          <div class="achievement-list" id="achievementList"></div>
        </section>

        <section class="sidebar-card reveal">
          <div class="sidebar-heading"><h2>我的专栏</h2><button class="plain-link" type="button" data-feed-tab="notes">全部文章</button></div>
          <div class="column-list" id="columnList"></div>
        </section>

        <section class="sidebar-card reveal">
          <div class="sidebar-heading"><h2>兴趣领域</h2><span>设置</span></div>
          <div class="interest-list" id="interestList"></div>
        </section>
      </aside>

      <section class="feed-panel reveal" id="articles">
        <div class="feed-toolbar">
          <div class="feed-tabs" id="feedTabs" role="tablist" aria-label="内容类型"></div>
          <label class="feed-search" for="noteSearch">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
            <input id="noteSearch" type="search" placeholder="搜索文章、项目或技术关键词…" autocomplete="off">
          </label>
        </div>
        <div class="feed-heading">
          <div><h2 id="feedTitle">最新文章</h2><p id="feedSubtitle">记录项目过程、问题排查与工程复盘。</p></div>
          <div class="feed-filters" id="feedFilters" role="group" aria-label="文章分类"></div>
        </div>
        <div class="feed-list" id="feedList" aria-live="polite"></div>
        <div class="empty-state" id="feedEmpty" hidden><strong>没有找到匹配内容</strong><span>试试其他关键词或分类。</span></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="section-shell footer-inner">
      <div class="footer-brand"><span class="brand-mark">MQ</span><strong id="footerName">MimiQuark 技术博客</strong></div>
      <p>© <span id="currentYear">2026</span> 项目记录与经验总结</p>
      <div class="footer-links"><a id="footerAdminLink" href="#" target="_blank" rel="noreferrer">后台管理</a><a href="#home">回到顶部 ↑</a></div>
    </div>
  </footer>

  <div class="modal" id="detailModal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" aria-label="关闭" data-close-modal>×</button>
      <div class="modal-hero" id="modalHero"><span id="modalEyebrow"></span><strong id="modalNumber"></strong></div>
      <div class="modal-content">
        <p class="modal-meta" id="modalMeta"></p>
        <h2 id="modalTitle"></h2>
        <p class="modal-lead" id="modalLead"></p>
        <div class="modal-sections" id="modalSections"></div>
      </div>
    </article>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js?v=20261006-profile-layout"></script>
  <script src="app.js?v=20261006-profile-layout"></script>
</body>
</html>
